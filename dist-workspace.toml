[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Only run the release workflow on version tags, never on pull requests
pr-run-mode = "skip"
# The repository holding the Homebrew formula (a human creates it; docs/releases/README.md)
tap = "acs-hq/homebrew-tap"
# The Homebrew formula name (the package is `acs-cli`, the command is `acs`)
formula = "acs"
# The npm package: @acs-hq/acs, which installs the `acs` command
npm-scope = "@acs-hq"
npm-package = "acs"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm"]
# Adds the Scoop manifest to the release's files
global-artifacts-jobs = ["./scoop-manifest"]
# Tries every installer of the published release on a clean machine
post-announce-jobs = ["./installers"]
