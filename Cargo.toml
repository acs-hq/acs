[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/acs-hq/acs"

[workspace.dependencies]
# Dependencies are added by the work packages that need them.
dunce = "1.0.5"
getrandom = "0.4.3"
globset = { version = "0.4.18", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
jsonschema = { version = "0.60.2", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = { version = "1.2.3", features = ["jiff02"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
zstd = "0.14.3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
