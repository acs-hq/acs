name: Feature or improvement
description: Something ACS should do, or do better, that it does not do today.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong or is missing today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What ACS should do instead. Rough is fine.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Claims
        - Sealed paths and policy
        - Shell analysis and banned commands
        - Git backstop (git hooks)
        - Team sync
        - CLI (init, status, doctor, claim, release, off)
        - MCP tools
        - Claude Code integration
        - Antigravity integration
        - Install and release
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How we will know this is finished.
    validations:
      required: false
