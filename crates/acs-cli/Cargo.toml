[package]
name = "acs-cli"
description = "The `acs` binary: commands and hook entrypoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "acs_cli"
path = "src/lib.rs"

[[bin]]
name = "acs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
acs-adapters = { path = "../acs-adapters" }
acs-core = { path = "../acs-core" }
acs-git = { path = "../acs-git" }
acs-mcp = { path = "../acs-mcp" }
acs-paths = { path = "../acs-paths" }
acs-policy = { path = "../acs-policy" }
acs-shell = { path = "../acs-shell" }
acs-store = { path = "../acs-store" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
dunce.workspace = true
tempfile.workspace = true
