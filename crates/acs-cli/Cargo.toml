[package]
name = "acs-cli"
description = "Agent Control System: coordinates coding agents and humans working in one repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "acs_cli"
path = "src/lib.rs"

[[bin]]
name = "acs"
path = "src/main.rs"

# `publish = false` keeps the crate off crates.io and, unless overridden here, off dist too.
[package.metadata.dist]
dist = true

# The root of a virtual workspace can hold no targets, so these two live here.
[[test]]
name = "e2e_scenarios"
path = "../../tests/e2e/main.rs"

[[bench]]
name = "hook_paths"
path = "../../benches/hook_paths.rs"
harness = false

[lints]
workspace = true

[dependencies]
acs-adapters = { path = "../acs-adapters" }
acs-core = { path = "../acs-core" }
acs-git = { path = "../acs-git" }
acs-mcp = { path = "../acs-mcp" }
acs-os = { path = "../acs-os" }
acs-paths = { path = "../acs-paths" }
acs-policy = { path = "../acs-policy" }
acs-shell = { path = "../acs-shell" }
acs-store = { path = "../acs-store" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
dunce.workspace = true
tempfile.workspace = true
